<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Transacción</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css">
</head>
<body>
  <main class="container">
    <h2>Editar Transacción</h2>
    <form method="POST">
      <label for="tipo">Tipo</label>
      <select name="tipo" id="tipo" required>
        <option value="Ingreso" {% if transaccion.tipo == 'Ingreso' %}selected{% endif %}>Ingreso</option>
        <option value="Gasto" {% if transaccion.tipo == 'Gasto' %}selected{% endif %}>Gasto</option>
      </select>

      <label for="categoria">Categoría</label>
      <input type="text" name="categoria" id="categoria" value="{{ transaccion.categoria }}" required>

      <label for="monto">Monto</label>
      <input type="number" step="0.01" name="monto" id="monto" value="{{ transaccion.monto }}" required>

      <label for="descripcion">Descripción</label>
      <input type="text" name="descripcion" id="descripcion" value="{{ transaccion.descripcion }}">

      <div style="display: flex; gap: 10px; margin-top: 1rem;">
        <button type="submit">Guardar Cambios</button>
        <a href="/" role="button" class="secondary">Cancelar</a>
      </div>
    </form>
  </main>
</body>
</html>
